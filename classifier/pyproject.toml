[project]
name = "edm-classifier"
version = "0.1.0"
description = "Automatic subgenre classification of electronic dance music (Short-chunk CNN + ResNet)."
authors = [{ name = "Facundo Rivas" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "librosa>=0.10.2",
    "soundfile>=0.12",
    "audioread>=3.0",
    "torch>=2.2",
    "torchaudio>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-multipart>=0.0.9",
]

[project.scripts]
edm-classifier = "edm_classifier.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edm_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=edm_classifier --cov-report=term-missing"

[tool.coverage.run]
source = ["edm_classifier"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Colab launcher notebooks are glue, not package code.
extend-exclude = ["colab"]

[tool.ruff.lint]
# PEP 8 (E/W), pyflakes (F), imports (I), naming (N), bugbear (B), pyupgrade (UP)
select = ["E", "W", "F", "I", "N", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# `X` (uppercase) for feature matrices is the standard scikit-learn convention.
"**/baselines.py" = ["N803", "N806"]
"tests/**" = ["N803", "N806"]
# `import torch.nn.functional as F` is the universal PyTorch convention.
"**/models/*.py" = ["N812"]
